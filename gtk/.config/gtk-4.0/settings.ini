# GTK4 mostly honours org.gnome.desktop.interface color-scheme via libadwaita,
# so this file is for consistency rather than repair — it keeps non-adwaita
# GTK4 apps on the same theme as GTK3.
[Settings]
gtk-theme-name=rice-tokyonight-blue-standard+default
gtk-icon-theme-name=Papirus-Mocha
gtk-font-name=Ubuntu Sans 11
