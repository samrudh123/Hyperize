# GTK3 darkness for apps that are NOT libadwaita.
#
# Under a full GNOME session an XSettings daemon pushes org.gnome.desktop.
# interface values into GTK3 apps. Hyprland runs no such daemon, so GTK3 falls
# back to this file — and with the file absent it used the stock LIGHT Adwaita,
# regardless of `gsettings get ... color-scheme` saying prefer-dark.
#
# That is why the VS Code / Electron file chooser came up white while Nautilus
# stayed dark: the chooser is drawn by xdg-desktop-portal-gtk (GTK3), while
# Nautilus is GTK4/libadwaita and reads color-scheme itself.
#
# gtk-application-prefer-dark-theme is GTK3-only and is the switch that makes
# a theme's dark variant apply; the *-dark theme name alone is not always
# enough for apps that ask for the light variant explicitly.
[Settings]
gtk-theme-name=rice-tokyonight-rosewater-standard+default
gtk-icon-theme-name=Papirus-Mocha
gtk-application-prefer-dark-theme=1
gtk-font-name=Ubuntu Sans 11
