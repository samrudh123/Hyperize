# 10-band equalizer for the music panel (Quickshell MediaPopup.qml).
#
# Runs as its own PipeWire client (rice-eq.service: `pipewire -c <this>`),
# so the main daemon never restarts. It is a WirePlumber SMART FILTER:
# WirePlumber puts it in front of the DEFAULT sink by itself and moves it
# when the default changes (speakers <-> Bluetooth), while the default sink
# stays the real device (volume, the bar's audio pill, the visualizer).
#
#   stream -> rice-eq (Audio/Sink, never the default) -> default sink
#
# Gains here are flat; hypr/eq.py sets the live ones (pw-cli set-param) and
# re-applies the saved state from ~/.local/state/eq/state.json when the
# service starts (ExecStartPost). Off = `pw-metadata -n filters <id>
# filter.smart.disabled true` (eq.py on|off) — the chain is bypassed live.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Equalizer"
            media.name       = "Equalizer"
            filter.graph = {
                nodes = [
                    # preamp: headroom for boosts (eq.py sets it to -max gain)
                    { type = builtin name = preamp label = linear control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = builtin name = eq_band_1  label = bq_peaking control = { "Freq" = 31.0    "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_2  label = bq_peaking control = { "Freq" = 62.0    "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_3  label = bq_peaking control = { "Freq" = 125.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_4  label = bq_peaking control = { "Freq" = 250.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_5  label = bq_peaking control = { "Freq" = 500.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_6  label = bq_peaking control = { "Freq" = 1000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_7  label = bq_peaking control = { "Freq" = 2000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_8  label = bq_peaking control = { "Freq" = 4000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_9  label = bq_peaking control = { "Freq" = 8000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_10 label = bq_peaking control = { "Freq" = 16000.0 "Q" = 1.0 "Gain" = 0.0 } }
                ]
                links = [
                    { output = "preamp:Out"     input = "eq_band_1:In" }
                    { output = "eq_band_1:Out"  input = "eq_band_2:In" }
                    { output = "eq_band_2:Out"  input = "eq_band_3:In" }
                    { output = "eq_band_3:Out"  input = "eq_band_4:In" }
                    { output = "eq_band_4:Out"  input = "eq_band_5:In" }
                    { output = "eq_band_5:Out"  input = "eq_band_6:In" }
                    { output = "eq_band_6:Out"  input = "eq_band_7:In" }
                    { output = "eq_band_7:Out"  input = "eq_band_8:In" }
                    { output = "eq_band_8:Out"  input = "eq_band_9:In" }
                    { output = "eq_band_9:Out"  input = "eq_band_10:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "rice-eq"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "rice-eq"
            }
            playback.props = {
                node.name    = "rice-eq.output"
                node.passive = true
            }
        }
    }
]
