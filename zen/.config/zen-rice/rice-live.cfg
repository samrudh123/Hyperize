// Zen: the desktop theme + accent, live. (First line must be a comment.)
//
// Zen's own live accent is a pref (zen.theme.accent-color) that nothing
// outside the browser can set, and it ignores Firefox lightweight themes —
// so the Rice Accent extension that recolours Firefox does nothing here.
// Instead this autoconfig script (privileged JS Zen runs at startup; see
// autoconfig.js) watches ~/.config/hypr/theme/accent and palette.json
// (set-accent.sh / set-theme.sh) and puts the colours on every Zen window,
// bookmarks/history sidebar included, as --rice-* CSS variables. userChrome.css
// (theme/templates/zen-userChrome.css) reads them, with the hex it was
// rendered with as the fallback; Zen's own pages (new tab, settings, about:)
// get them through a registered user sheet that userContent.css reads.
// Also flips Zen between dark and light with the desktop's mode (applyMode).
// Polls once a second: a stat of two files.
//
// Installed into Zen's install dir by build/zen.sh. RICE_THEME_DIR in the
// environment points it at another theme directory (tests).
try {
  // The autoconfig scope has Services / ChromeUtils / Cu but not IOUtils or
  // PathUtils, hence nsIFile: two tiny files, read synchronously on change.
  const { setInterval } = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");
  const dir = Services.env.get("RICE_THEME_DIR") || null;
  const file = (name) => {
    let f;
    if (dir) {
      f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      f.initWithPath(dir);
    } else {
      f = Services.dirsvc.get("Home", Ci.nsIFile);
      for (const part of [".config", "hypr", "theme"]) f.append(part);
    }
    f.append(name);
    return f;
  };
  const FILES = [file("accent"), file("palette.json")];
  const ROLES = ["base", "mantle", "crust", "surface0", "surface1", "surface2",
                 "overlay0", "subtext0", "text"];
  const HEX = /^#?[0-9a-fA-F]{6}$/;

  let stamp = "";
  let vars = null;

  function readColours() {
    const out = {};
    try {
      const p = JSON.parse(Cu.readUTF8File(FILES[1]));
      for (const r of ROLES) if (HEX.test(p[r] || "")) out[`--rice-${r}`] = "#" + p[r].replace("#", "");
    } catch (e) {}
    try {
      const a = Cu.readUTF8File(FILES[0]).trim();
      if (HEX.test(a)) out["--rice-accent"] = "#" + a.replace("#", "");
    } catch (e) {}
    return Object.keys(out).length ? out : null;
  }

  function paint(doc) {
    const root = doc && doc.documentElement;
    if (!root || !root.style) return;
    for (const [k, v] of Object.entries(vars)) {
      if (root.style.getPropertyValue(k) !== v) root.style.setProperty(k, v);
    }
  }

  function paintAll() {
    if (!vars) return;
    for (const win of Services.wm.getEnumerator(null)) {
      const doc = win.document;
      paint(doc);
      // the bookmarks / history panel is a document of its own
      const sb = doc.getElementById && doc.getElementById("sidebar");
      if (sb && sb.contentDocument) paint(sb.contentDocument);
    }
  }

  // Firefox's own pages (new tab, settings, about:…) run in content processes,
  // out of reach of paint(). Their colours come from chrome/userContent.css as
  // var(--rice-*, rendered hex) — so give them the variables through a tiny
  // user sheet (the style-sheet service applies it in every process), swapped
  // for a new one whenever the colours change.
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  let pageSheet = null;

  function pages() {
    if (pageSheet && sss.sheetRegistered(pageSheet, sss.USER_SHEET)) sss.unregisterSheet(pageSheet, sss.USER_SHEET);
    pageSheet = null;
    if (!vars) return;
    const decl = Object.entries(vars).map(([k, v]) => `${k}: ${v} !important;`).join(" ");
    const css = `@-moz-document url-prefix("about:"), url-prefix("chrome://") { :root { ${decl} } }`;
    pageSheet = Services.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
    sss.loadAndRegisterSheet(pageSheet, sss.USER_SHEET);
  }

  // Dark / light mode (palette.json "mode", Settings › Appearance › Mode):
  // the prefs that decide what Zen's chrome and web pages call
  // prefers-color-scheme, all live. Applied only when the mode CHANGES from
  // the one last applied (rice.mode.applied), so a site-appearance choice
  // made in Zen's own settings survives restarts until the next mode flip.
  const MODE_PREFS = {                  // [dark, light]
    "layout.css.prefers-color-scheme.content-override": [0, 1],
    "browser.theme.toolbar-theme": [0, 1],
    "zen.view.window.scheme": [0, 1],
  };
  function applyMode() {
    let mode = "dark";
    try { mode = JSON.parse(Cu.readUTF8File(FILES[1])).mode === "light" ? "light" : "dark"; } catch (e) {}
    const i = mode === "light" ? 1 : 0;
    // what Zen takes as "the system" (no Settings UI; user.js sets it dark
    // at every start, because Hyprland's portal often answers "no
    // preference"): always kept on the desktop's mode
    try {
      if (Services.prefs.getIntPref("ui.systemUsesDarkTheme", -1) !== 1 - i)
        Services.prefs.setIntPref("ui.systemUsesDarkTheme", 1 - i);
    } catch (e) {}
    if (Services.prefs.getStringPref("rice.mode.applied", "") === mode) return;
    for (const [k, v] of Object.entries(MODE_PREFS)) {
      try { if (Services.prefs.getIntPref(k, -1) !== v[i]) Services.prefs.setIntPref(k, v[i]); } catch (e) {}
    }
    Services.prefs.setStringPref("rice.mode.applied", mode);
  }

  function tick() {
    try {
      const s = FILES.map((f) => (f.exists() ? `${f.lastModifiedTime}:${f.fileSize}` : "-")).join("|");
      if (s !== stamp) {
        stamp = s;
        vars = readColours();
        pages();
        applyMode();
      }
      paintAll();            // also reaches windows / sidebars opened since
    } catch (e) {}
  }

  setInterval(tick, 1000);
  Services.obs.addObserver(() => tick(), "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError("rice-live.cfg: " + e);
}
