# Put ~/.local/bin (ya, yazi, qs, dl-popup, ...) on the session PATH.
# GDM's Wayland session takes its environment from the systemd user manager,
# which reads this directory, so Hyprland and everything it launches
# (keybinds, exec-once, yazi openers) inherit it. ~/.profile is not read on
# this path. Takes effect at the next login.
PATH=$HOME/.local/bin:$PATH
