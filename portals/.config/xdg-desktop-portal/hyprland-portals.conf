# Overrides /usr/share/xdg-desktop-portal/hyprland-portals.conf.
# File open/save dialogs → yazi (xdg-desktop-portal-termfilechooser, installed
# in ~/.local). To go back to the GTK dialog, change termfilechooser to gtk.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=termfilechooser
