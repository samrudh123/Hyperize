# aria2 daemon — started by ~/.config/systemd/user/aria2.service, driven by
# ~/.local/bin/dl-popup (the fuzzel download popup) over JSON-RPC.
# Paths must be absolute: aria2 does not expand ~ in this file.

dir=@HOME@/Downloads

# --- RPC (localhost only; the secret stops web pages from POSTing to it) ---
enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-secret=@SECRET@

# --- defaults; dl-popup overrides these per download ---
max-concurrent-downloads=3
split=8
max-connection-per-server=8
min-split-size=1M
max-overall-download-limit=0

# --- robustness ---
continue=true
max-tries=5
retry-wait=5
connect-timeout=30
timeout=60
auto-file-renaming=true
allow-overwrite=false
content-disposition-default-utf8=true
file-allocation=falloc
disk-cache=32M

# --- survive restarts: unfinished downloads are reloaded on start ---
input-file=@HOME@/.local/state/aria2/session
save-session=@HOME@/.local/state/aria2/session
save-session-interval=30

# --- desktop notifications ---
on-download-complete=@HOME@/.config/aria2/on-complete.sh
on-download-error=@HOME@/.config/aria2/on-error.sh

# BitTorrent stays possible but quiet
seed-time=0
