# Battery-aware idle management.
# On a 14" laptop this is what keeps Hyprland from eating your battery.
general {
    lock_cmd       = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# dim the backlight first - cheap, reversible, barely noticeable
listener {
    timeout    = 150
    on-timeout = ~/.config/hypr/brightness.sh save && ~/.config/hypr/brightness.sh set 10
    on-resume  = ~/.config/hypr/brightness.sh restore
}

# lock
listener {
    timeout    = 330
    on-timeout = loginctl lock-session
}

# screen off - the big power saving
listener {
    timeout    = 390
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on && ~/.config/hypr/brightness.sh restore
}

# suspend
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
