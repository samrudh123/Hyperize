# GENERATED by idle.sh from idle.json — change the timeouts in Settings ›
# Power (or the ⏻ power panel), not here: this file is rewritten.
general {
    lock_cmd       = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# ── battery: screen off 300 s, sleep 1800 s (0 = never)
listener {
    timeout    = 240
    on-timeout = ~/.config/hypr/idle.sh timeout dim battery
    on-resume  = ~/.config/hypr/idle.sh resume dim
}
listener {
    timeout    = 300
    on-timeout = ~/.config/hypr/idle.sh timeout screen battery
    on-resume  = ~/.config/hypr/idle.sh resume screen
}
listener {
    timeout    = 1800
    on-timeout = ~/.config/hypr/idle.sh timeout sleep battery
}

# ── ac: screen off 600 s, sleep 1800 s (0 = never)
listener {
    timeout    = 540
    on-timeout = ~/.config/hypr/idle.sh timeout dim ac
    on-resume  = ~/.config/hypr/idle.sh resume dim
}
listener {
    timeout    = 600
    on-timeout = ~/.config/hypr/idle.sh timeout screen ac
    on-resume  = ~/.config/hypr/idle.sh resume screen
}
listener {
    timeout    = 1800
    on-timeout = ~/.config/hypr/idle.sh timeout sleep ac
}
