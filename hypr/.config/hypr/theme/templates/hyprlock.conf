# ─── hyprlock · Catppuccin Mocha ───────────────────────────────────────────

general {
    hide_cursor        = true
    ignore_empty_input = true
    grace              = 2
}

background {
    monitor =
    path    = screenshot
    blur_passes   = 3
    blur_size     = 6
    noise         = 0.012
    contrast      = 0.9
    brightness    = 0.75
    vibrancy      = 0.17
}

# ─── big clock ─────────────────────────────────────────────────────────────
label {
    monitor  =
    text     = cmd[update:1000] echo "$(date +'%H:%M')"
    color    = rgba(cdd6f4ff)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 190
    halign   = center
    valign   = center
}

label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color    = rgba(a6adc8ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 105
    halign   = center
    valign   = center
}

# ─── battery ───────────────────────────────────────────────────────────────
label {
    monitor =
    text    = cmd[update:30000] echo "  $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%  ·  $(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1)"
    color   = rgba(9399b2ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign  = center
    valign  = top
}

# ─── input field ───────────────────────────────────────────────────────────
input-field {
    monitor =
    size    = 300, 52
    outline_thickness = 2
    dots_size     = 0.26
    dots_spacing  = 0.3
    dots_center   = true
    dots_rounding = -1

    outer_color   = rgba(@@ACCENT@@ff)
    inner_color   = rgba(1e1e2ecc)
    font_color    = rgba(cdd6f4ff)
    check_color   = rgba(89b4faff)
    fail_color    = rgba(f38ba8ff)

    fade_on_empty = false
    rounding      = 12
    placeholder_text = <span foreground="##9399b2">Enter password</span>
    fail_text     = <span foreground="##f38ba8">Wrong ($ATTEMPTS)</span>
    hide_input    = false

    position = 0, -80
    halign   = center
    valign   = center
}

label {
    monitor =
    text    = $USER
    color   = rgba(bac2deff)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign  = center
    valign  = center
}
