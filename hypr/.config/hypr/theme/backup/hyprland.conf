# ╭──────────────────────────────────────────────────────────────────────────╮
# │  Hyprland · Catppuccin Mocha                                             │
# │  Tuned for: 14" 1680x1050 laptop · Intel Arc iGPU                        │
# ╰──────────────────────────────────────────────────────────────────────────╯

# ─── Monitor ───────────────────────────────────────────────────────────────
# no fractional scaling: 1680x1050 on 14" is already comfortable at 1x
monitor = ,preferred,auto,1

# ─── Programs ──────────────────────────────────────────────────────────────
$terminal = ghostty
# SUPER+D app grid. fuzzel is still used for the --dmenu pickers
# (cliphist, wallpaper, lock screen) — nwg-drawer has no dmenu mode.
$menu     = ~/.config/hypr/app-grid.sh
$browser  = /snap/bin/brave
# --force-user-env matches what the snap's own .desktop passes, so launching
# from the keybind gives the same environment as launching from the dock.
$editor   = /snap/bin/code --force-user-env
$fileMgr  = ghostty -e ~/.local/bin/yazi
$mainMod  = SUPER

# ─── Autostart ─────────────────────────────────────────────────────────────
exec-once = waybar
# App sidebar. NOT waybar: waybar 0.15.0 builds ZERO widgets on a vertical
# bar (position left/right), so a side dock is impossible there.
# nwg-dock-hyprland drives gtk-layer-shell directly and shows real app icons.
# -x = exclusive zone (windows tile beside it), -r = resident so SUPER+A can
# toggle it via SIGRTMIN+1 without restarting the process.
# Pinned apps live in ~/.cache/nwg-dock-pinned as bare WINDOW CLASSES (no
# .desktop suffix). With the right format nwg-dock merges pinned+running into
# one icon and draws a dot under it - no -g ignore list needed.
# Trash + mounted disks as dock entries (Ubuntu-dock style), then any custom
# icons from dock-icons.conf. Order before the dock is tidiness only — nwg-dock
# re-reads the pinned list on its next event.
exec-once = ~/.config/hypr/dock-places.sh
exec-once = ~/.config/hypr/dock-icons.sh
# The dock's flags now live in dock-start.sh, which ALSO waits for waybar to
# map before committing its own layer surface. exec-once fires every line at
# once and does not wait, and the dock maps faster than waybar — when it won
# that race it took the exclusive zone first and came up as `6 6 78 1188`
# (full screen height, over the bar), shoving waybar to `92 5 1820 40`.
# SUPER+A appeared to fix it only because hide/show re-commits the surface.
exec-once = ~/.config/hypr/dock-start.sh
# Re-runs dock-places.sh when a volume is mounted or unmounted. Without it the
# places are a snapshot taken at login — and the BitLocker Windows partition is
# always unlocked AFTER login, so its icon could never appear.
exec-once = /usr/bin/python3 ~/.config/hypr/mount-watch.py
# Unlock + mount the BitLocker Windows partition at login. Silent no-op
# unless ~/.config/hypr/.windows-key exists — see that script's header for
# what storing the passphrase costs you on an unencrypted /home.
exec-once = ~/.config/hypr/mount-windows.sh --boot
# hyprpaper 0.8.3 (Ubuntu 26.04) is broken: it connects to Wayland, then never
# parses its config or creates a background layer, and every `hyprctl hyprpaper`
# verb returns "Unknown hyprpaper request". swaybg does the same job reliably.
exec-once = ~/.config/hypr/set-wallpaper.sh --restore
exec-once = mako
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
# Stack/compact the workspaces, like pages of apps on a phone. Hyprland
# destroys empty workspaces but never renumbers the rest, so you end up with
# holes (1, 3, 7). This daemon watches the event socket and slides everything
# down so the occupied workspaces are always 1..N with no gaps.
# Absolute python3: exec-once children inherit a PATH where `python3` is the
# ~/aiops venv. Run with --once to compact by hand.
exec-once = /usr/bin/python3 ~/.config/hypr/workspace-stack.py
# polkit agent - without this, GUI apps can never ask for your password
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

# ─── Environment ───────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# Intel Arc / Meteor Lake hardware video acceleration
env = LIBVA_DRIVER_NAME,iHD

# ─── Look & feel ───────────────────────────────────────────────────────────
general {
    # small gaps: a 14" panel has no screen real estate to waste
    gaps_in     = 3
    gaps_out    = 6
    border_size = 2

    col.active_border   = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(45475aaa)

    resize_on_border = true
    allow_tearing    = false
    layout           = dwindle
}

decoration {
    rounding = 10

    active_opacity   = 1.0
    inactive_opacity = 0.96

    blur {
        enabled     = true
        # modest blur - this is the single biggest battery cost in Hyprland.
        # bump size to 8 / passes to 3 when plugged in if you want it heavier.
        size        = 4
        passes      = 2
        new_optimizations = true
        xray        = false
        popups      = true
        noise       = 0.012
        contrast    = 1.05
        brightness  = 0.92
    }

    shadow {
        enabled      = true
        range        = 12
        render_power = 2
        color        = rgba(11111baa)
        color_inactive = rgba(11111b55)
    }
}

animations {
    enabled = true
    # fast curves: feels snappy, finishes quickly, costs less GPU time
    bezier = easeOutQuint,  0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,        0,    0,    1,    1
    bezier = almostLinear,  0.5,  0.5,  0.75, 1.0
    bezier = quick,         0.15, 0,    0.1,  1

    animation = global,        1, 8,  default
    animation = border,        1, 4,  easeOutQuint
    animation = windows,       1, 3.5, easeOutQuint
    animation = windowsIn,     1, 3,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.5, linear,      popin 87%
    animation = fadeIn,        1, 1.7, almostLinear
    animation = fadeOut,       1, 1.4, almostLinear
    animation = fade,          1, 3,  quick
    animation = layers,        1, 2.5, easeOutQuint
    animation = layersIn,      1, 2.5, easeOutQuint, fade
    animation = layersOut,     1, 1.5, linear,       fade
    animation = workspaces,    1, 1.8, almostLinear, fade
    animation = workspacesIn,  1, 1.3, almostLinear, fade
    animation = workspacesOut, 1, 1.3, almostLinear, fade
}

dwindle {
    pseudotile     = true
    preserve_split = true
    smart_split    = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    disable_splash_rendering = true
    vfr = true          # variable refresh: big battery win when idle
    vrr = 0
    focus_on_activate = true
}

# ─── Input ─────────────────────────────────────────────────────────────────
input {
    kb_layout  = us
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll      = true
        tap-to-click        = true
        disable_while_typing = true
        scroll_factor       = 0.6
        clickfinger_behavior = true
    }
}

# 3-finger horizontal swipe to change workspace.
# NOTE: the old `gestures { workspace_swipe = true }` block was removed in
# Hyprland 0.49+; this one-line form is the current syntax.
gesture = 3, horizontal, workspace

cursor {
    inactive_timeout = 5
    hide_on_key_press = true
}

# ─── Keybinds ──────────────────────────────────────────────────────────────
bind = $mainMod,       Return, exec, $terminal
bind = $mainMod,       D,      exec, $menu
bind = $mainMod,       B,      exec, $browser
bind = $mainMod,       E,      exec, $fileMgr
# Windows drive in yazi. Runs in a terminal on purpose: if the volume is
# still locked, udisksctl prompts for the passphrase there with echo off.
bind = $mainMod,       M,      exec, ghostty -e ~/.config/hypr/mount-windows.sh --open   # Windows drive
# SHIFT+C, not C: plain SUPER+C is hyprpicker.
bind = $mainMod SHIFT, C,      exec, $editor                          # VS Code
bind = $mainMod,       Q,      killactive,
bind = $mainMod SHIFT, E,      exit,
bind = $mainMod,       V,      togglefloating,
bind = $mainMod,       F,      fullscreen, 0
bind = $mainMod SHIFT, F,      fullscreen, 1
bind = $mainMod,       P,      pseudo,
bind = $mainMod,       T,      togglesplit,
bind = $mainMod,       X,      exec, hyprlock
# Same dialog as the tray power button. nwg-bar 0.1.6 is self-toggling: a
# second launch terminates the running one (verified, 4 alternating launches,
# no stray layer surface), so no toggle wrapper is needed and mashing the key
# cannot stack dialogs. It does NOT close on focus loss -- Escape or Cancel.
bind = $mainMod SHIFT, X,      exec, nwg-bar   # power menu
bind = $mainMod,       C,      exec, hyprpicker -a      # pick colour -> clipboard
# Theme accent for the whole environment. Previews live as you move the
# selection; Escape puts back what you started with. set-accent.sh holds the
# templates and the pristine backups — see its header.
bind = $mainMod ALT,   C,      exec, /usr/bin/python3 ~/.config/hypr/accent-picker.py  # pick accent colour
bind = $mainMod,       A,      exec, ~/.config/hypr/dock-toggle.sh   # show/hide dock
# Grid of thumbnails. `set-wallpaper.sh` with no args is still the fuzzel
# name-only fallback; absolute python3 because ~/aiops shadows python3.
bind = $mainMod,       W,      exec, /usr/bin/python3 ~/.config/hypr/wallpaper-grid.py  # pick wallpaper
# lock screen wallpaper is deliberately separate from the desktop one. Same grid,
# --lock swaps the setter and adds the `screenshot` tile; set-lockscreen.sh with
# no args is still the fuzzel name-only fallback.
bind = $mainMod SHIFT, W, exec, /usr/bin/python3 ~/.config/hypr/wallpaper-grid.py --lock  # pick lock screen image
# gnome-control-center exits unless XDG_CURRENT_DESKTOP names GNOME
bind = $mainMod,       I,      exec, gtk-launch org.gnome.Settings   # settings
bind = $mainMod,       slash,  exec, ghostty -e batcat --style=plain --paging=always ~/.config/hypr/CHEATSHEET.md   # keybind cheatsheet

# clipboard history
bind = $mainMod SHIFT, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, H,     movefocus, l
bind = $mainMod, J,     movefocus, d
bind = $mainMod, K,     movefocus, u
bind = $mainMod, L,     movefocus, r

# move windows
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# resize
binde = $mainMod CTRL, left,  resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive,  40 0
binde = $mainMod CTRL, up,    resizeactive,  0 -40
binde = $mainMod CTRL, down,  resizeactive,  0  40

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# scratchpad
bind = $mainMod,     S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspace, special:magic

# cycle workspaces with the scroll wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# mouse drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# screenshots — all three save to ~/Pictures/Screenshots, copy to the clipboard
# and raise a notification. The previous binds were a bare `grim - | wl-copy`:
# it worked, but wrote no file and gave no feedback, so it read as a dead key.
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/screenshot.sh region
bind = ,        Print,     exec, ~/.config/hypr/screenshot.sh screen
bind = SHIFT,   Print,     exec, ~/.config/hypr/screenshot.sh window

# ─── Laptop hardware keys ──────────────────────────────────────────────────
bindel = ,XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = ,XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = ,XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp,   exec, ~/.config/hypr/brightness.sh up 5
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/brightness.sh down 5

bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause,exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

# lid close -> lock
bindl = ,switch:on:Lid Switch, exec, hyprlock

# ─── Window rules ──────────────────────────────────────────────────────────
# NOTE: Hyprland 0.53 uses BLOCK syntax for windowrule. The old one-line
# `windowrule = float, class:...` form and `windowrulev2` are both gone.

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-system-dialogs
    match:class = ^(pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator)$
    float = yes
}

windowrule {
    name = size-pavucontrol
    match:class = ^(pavucontrol)$
    size = 800 600
}
# The wallpaper grid is a NORMAL window, not a layer surface — deliberately, so
# it needs no namespace-keyed blur rule and cannot repeat landmines 13/16.
# Its app_id comes from GLib.set_prgname() in the script.
windowrule {
    name = float-wallpaper-grid
    match:class = ^(wallpaper-grid)$
    float = yes
}
windowrule {
    name = center-wallpaper-grid
    match:class = ^(wallpaper-grid)$
    center = yes
}

# Same deal for the accent picker: normal toplevel, app_id from set_prgname().
windowrule {
    name = float-accent-picker
    match:class = ^(accent-picker)$
    float = yes
}
windowrule {
    name = center-accent-picker
    match:class = ^(accent-picker)$
    center = yes
}

# keep these fully opaque - blur behind a translucent terminal looks muddy
windowrule {
    name = opaque-terminal
    match:class = ^(com.mitchellh.ghostty)$
    opacity = 1.0
}

windowrule {
    name = opaque-browser
    match:class = ^([Bb]rave-browser|firefox)$
    opacity = 1.0
}

# layerrule moved to block syntax too, and `name` must be the first field.
layerrule {
    name = blur-dock
    # The sidebar registers as "nwg-dock", not "dock" — this rule matched
    # nothing, so the sidebar was never blurred either (landmine 16).
    match:namespace = ^(nwg-dock)$
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-waybar
    match:namespace = ^(waybar)$
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-launcher
    # fuzzel's layer-shell namespace is "launcher", NOT "fuzzel" — verified with
    # `hyprctl layers` while a picker was open. This rule matched ^(fuzzel)$ for
    # the life of the config and therefore never blurred anything.
    match:namespace = ^(launcher)$
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-app-grid
    match:namespace = ^(nwg-drawer)$
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-power-bar
    # nwg-bar 0.1.6 does NOT set a namespace, so it inherits gtk-layer-shell's
    # library default — verified with `hyprctl layers` while it was open, since
    # assuming the program name is what bit us with fuzzel (landmine 16).
    # This is a generic name: anything else using gtk-layer-shell without
    # setting its own namespace would match too. Nothing else here does
    # (nwg-dock/nwg-drawer/waybar/fuzzel/mako all set their own).
    match:namespace = ^(gtk-layer-shell)$
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-notifications
    match:namespace = ^(notifications)$
    blur = true
}
