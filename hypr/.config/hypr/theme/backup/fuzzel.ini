# ─── fuzzel · Catppuccin Mocha ───
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty -e
layer=overlay
lines=10
width=42
horizontal-pad=22
vertical-pad=16
inner-pad=8

[colors]
background=1e1e2ee6
text=cdd6f4ff
match=f38ba8ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=f38ba8ff
border=cba6f7ff
prompt=bac2deff
placeholder=9399b2ff
input=cdd6f4ff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g
execute=Return KP_Enter Control+y
cursor-left=Left Control+b
cursor-right=Right Control+f
prev=Up Control+p
next=Down Control+n
