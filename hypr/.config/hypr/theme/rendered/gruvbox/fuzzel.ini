# ─── fuzzel · Catppuccin Mocha ───
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
icon-theme=Papirus-Mocha
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty -e
layer=overlay
lines=10
width=42
horizontal-pad=22
vertical-pad=16
inner-pad=8

[colors]
background=282828e6
text=ebdbb2ff
match=fb4934ff
selection=32302fff
selection-text=ebdbb2ff
selection-match=fb4934ff
border=@@ACCENT@@ff
prompt=bdae93ff
placeholder=928374ff
input=ebdbb2ff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g
execute=Return KP_Enter Control+y
cursor-left=Left Control+b
cursor-right=Right Control+f
prev=Up Control+p
next=Down Control+n
