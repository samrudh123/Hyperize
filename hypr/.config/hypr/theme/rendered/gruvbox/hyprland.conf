# ╭──────────────────────────────────────────────────────────────────────────╮
# │  Hyprland · Catppuccin Mocha                                             │
# │  Tuned for: 14" 1680x1050 laptop · Intel Arc iGPU                        │
# ╰──────────────────────────────────────────────────────────────────────────╯

# ─── Monitor ───────────────────────────────────────────────────────────────
# no fractional scaling: 1680x1050 on 14" is already comfortable at 1x
monitor = ,preferred,auto,1

# ─── Programs ──────────────────────────────────────────────────────────────
$terminal = ghostty
# SUPER+D app grid. fuzzel is still used for the --dmenu pickers
# (cliphist, wallpaper, lock screen) — nwg-drawer has no dmenu mode.
$menu     = ~/.config/hypr/app-grid.sh
# Absolute paths, not bare names: Hyprland execs inherit the session's PATH,
# which does NOT reliably include ~/.local/bin — so a ~/.local/bin symlink
# that works in a terminal can silently fail from a keybind.
#
# Zen, matching the xdg default (xdg-settings get default-web-browser ->
# zen.desktop), on SUPER+B. Firefox is the secondary on SUPER+SHIFT+B (was
# Brave until 2026-10-27; Brave is still installed, just no longer bound).
# Zen lives in ~/.local/opt/zen (build/zen.sh) — the binary itself, not the
# ~/.local/bin/zen symlink, for the PATH reason above.
$browser    = ~/.local/opt/zen/zen
$browserAlt = /usr/bin/firefox
# --force-user-env is GONE with the snap. It was a snap-confinement workaround
# to make the keybind's environment match the .desktop launcher's; the deb
# runs unconfined and rejects nothing, but the flag is simply meaningless now.
$editor   = /usr/bin/code
# Its own window class, so it can have its own opacity (96 %,
# opacity-defaults.conf) instead of Ghostty's 100. --class only takes effect in
# a separate Ghostty process, hence --gtk-single-instance=false (same as the
# file picker and yazi-terminal.sh).
# yazi-live.sh runs yazi and reopens it in place when the accent / theme
# changes (yazi can't reload its theme) — see the script.
$fileMgr  = ghostty --gtk-single-instance=false --class=com.samrudh.yazi -e ~/.config/yazi/yazi-live.sh
$mainMod  = SUPER

# ─── Autostart ─────────────────────────────────────────────────────────────
# The shell — top bar, bottom bar and the sidebar dock — is Quickshell:
# ~/.config/quickshell (start at shell.qml). It replaced two waybar instances
# and nwg-dock-hyprland on 2026-10-09. Their configs are left as they were;
# to go back, restore these lines from hyprland.conf.pre-quickshell (archived in ~/.dotfiles-backup/pre-backups-2026-10-17.tar.gz).
# The dock still reads ~/.cache/nwg-dock-pinned (bare WINDOW CLASSES) and the
# Mocha icons, starts hidden (SUPER+A shows it), floats with no exclusive zone
# and centres itself in the space the two bars leave.
# Trash + mounted disks as dock entries (Ubuntu-dock style), then any custom
# icons from dock-icons.conf. The dock re-reads the pinned list as it changes.
exec-once = ~/.config/hypr/dock-places.sh
exec-once = ~/.config/hypr/dock-icons.sh
# Absolute path: exec-once children do not get ~/.local/bin on PATH.
exec-once = ~/.local/bin/qs
# Re-runs dock-places.sh when a volume is mounted or unmounted. Without it the
# places are a snapshot taken at login — and the BitLocker Windows partition is
# always unlocked AFTER login, so its icon could never appear.
exec-once = /usr/bin/python3 ~/.config/hypr/mount-watch.py
# Unlock + mount the BitLocker Windows partition at login. Takes the passphrase
# from the login keyring (pam_gnome_keyring already unlocks it at GDM), falling
# back to ~/.config/hypr/.windows-key. Silent no-op if neither exists, and it
# never prompts, so a missing or wrong passphrase cannot hold up a login.
# See that script's header for how to store it, and what each option costs.
exec-once = ~/.config/hypr/mount-windows.sh --boot
# hyprpaper 0.8.3 (Ubuntu 26.04) is broken: it connects to Wayland, then never
# parses its config or creates a background layer, and every `hyprctl hyprpaper`
# verb returns "Unknown hyprpaper request". swaybg does the same job reliably.
exec-once = ~/.config/hypr/set-wallpaper.sh --restore
# Pause an animated wallpaper while the CURRENT workspace is fullscreen (it is
# hidden then anyway); mpvpaper's own -p / -a full can't (see the script).
exec-once = /usr/bin/python3 ~/.config/hypr/wallpaper-fullscreen.py
# YouTube Music's fullscreen button -> opaque window (video-fullscreen.py).
exec-once = /usr/bin/python3 ~/.config/hypr/video-fullscreen.py ytm
exec-once = mako
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
# Stack/compact the workspaces, like pages of apps on a phone. Hyprland
# destroys empty workspaces but never renumbers the rest, so you end up with
# holes (1, 3, 7). This daemon watches the event socket and slides everything
# down so the occupied workspaces are always 1..N with no gaps.
# Absolute python3: exec-once children inherit a PATH where `python3` is the
# ~/aiops venv. Run with --once to compact by hand.
exec-once = /usr/bin/python3 ~/.config/hypr/workspace-stack.py
# Tags new windows of the apps in opacity-defaults.conf (Ghostty 100, yazi 96…).
exec-once = ~/.config/hypr/opacity-watch.sh
# Kdenlive's main window tiles even though it maps like its floating splash.
exec-once = ~/.config/hypr/kdenlive-tile.sh
# KDE Connect: relays the phone's now-playing (any app) as an MPRIS player, so
# the bottom bar's mpris module shows it even when Spotify's Web API has lost
# the phone (see spotify-remote.py). Its XDG autostart entry is never read
# under Hyprland, hence started here. Pair once with `kdeconnect-app`.
exec-once = kdeconnectd
# Reconnect KDE Connect within seconds when the phone or laptop changes
# networks under Tailscale (kdec-netwatch.py) instead of waiting on the phone.
exec-once = /usr/bin/python3 ~/.config/hypr/kdec-netwatch.py
# Spotify on other devices -> an MPRIS player ("spotifyremote") for the bottom
# bar, media menu and playerctl. Fills in when KDE Connect can't see the phone.
exec-once = /usr/bin/python3 ~/.config/hypr/spotify-remote.py mpris
# Notification history for the bell in the top bar (notif-center.py): mako
# keeps almost none, so this logs every Notify off the session bus.
exec-once = /usr/bin/python3 ~/.config/hypr/notif-log.py
# Bar media controls follow a PLAYING player, not just the last one that changed.
exec-once = ~/.config/hypr/media-prefer-playing.sh
# Bluetooth headphones (multipoint) follow whichever device plays:
# freed for the phone when it plays and the laptop is quiet, taken back when
# the laptop plays. `bt-follow.py off|on|status`.
exec-once = /usr/bin/python3 ~/.config/hypr/bt-follow.py
# polkit agent - without this, GUI apps can never ask for your password
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
# Screen sharing / OBS's "Screen Capture (PipeWire)" need the Hyprland portal.
# After a log-out + log-in the portal front-end (xdg-desktop-portal) outlives
# the old session and keeps talking to the dead xdph, so screen capture shows
# nothing ("[pipewire] No capture sources available" in OBS's log; seen
# 2026-10-11). Restart both against this session's Wayland display.
exec-once = sleep 2 && systemctl --user restart xdg-desktop-portal-hyprland && systemctl --user restart xdg-desktop-portal

# ─── Environment ───────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# Qt apps (KEditBookmarks, System Settings, Hyprland's share picker and
# dialogs, KDE Connect's pop-ups, …) read their colours, Breeze style, icons
# and fonts from ~/.config/kdeglobals through KDE's platform theme
# (plasma-integration). kde-theme.sh writes kdeglobals — Catppuccin Mocha in
# the current accent, Papirus-Mocha icons — on every accent change. Without
# this they drew light Fusion. OBS sets its own theme (Catppuccin, see
# ~/.config/obs-studio/themes) over this. New processes only.
env = QT_QPA_PLATFORMTHEME,kde
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# Intel Arc / Meteor Lake hardware video acceleration
env = LIBVA_DRIVER_NAME,iHD

# ─── Look & feel ───────────────────────────────────────────────────────────
general {
    # small gaps: a 14" panel has no screen real estate to waste
    gaps_in     = 1
    gaps_out    = 2
    border_size = 2

    # Serpantinum, like the shell's popups: a thin line round a rounded card
    # (decoration below) — the focused window's in the accent, the rest in
    # the popups' own surface1 outline. set-accent.sh's reload_live() sets
    # the active one live; keep the two in step.
    col.active_border   = rgba(@@ACCENT@@ff) rgba(@@ACCENT@@aa) 135deg
    col.inactive_border = rgba(3c3836e6)

    resize_on_border = true
    allow_tearing    = false
    layout           = dwindle
}

decoration {
    # the popups' corner radius (PanelPopup.qml card: 18)
    rounding = 18
    rounding_power = 2.4

    # Default for every app (VS Code included) — except the ones listed in
    # opacity-defaults.conf (Ghostty 100, yazi 96…), tagged by opacity-watch.sh. SUPER+SHIFT+Scroll changes the window
    # under the mouse — opacity.sh, which keeps its own copy of these numbers.
    active_opacity   = 0.92
    inactive_opacity = 0.88
    # Fullscreen / maximised windows follow the same transparency (was 1.0 =
    # always opaque); tagged windows keep their own level via opacity-rules.conf.
    fullscreen_opacity = 0.92

    blur {
        enabled     = true
        # modest blur - this is the single biggest battery cost in Hyprland.
        # bump size to 8 / passes to 3 when plugged in if you want it heavier.
        size        = 4
        passes      = 2
        new_optimizations = true
        xray        = false
        popups      = true
        noise       = 0.012
        contrast    = 1.05
        brightness  = 0.92
    }

    # A soft neutral drop shadow under the card, like the popups float over
    # the desktop (no accent glow any more — the accent is the border).
    shadow {
        enabled      = true
        range        = 18
        render_power = 3
        offset       = 0 5
        color        = rgba(14161799)
        color_inactive = rgba(14161755)
    }
}

animations {
    enabled = true
    # fast curves: feels snappy, finishes quickly, costs less GPU time
    bezier = easeOutQuint,  0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,        0,    0,    1,    1
    bezier = almostLinear,  0.5,  0.5,  0.75, 1.0
    bezier = quick,         0.15, 0,    0.1,  1

    # Serpantinum pop: windows open the way the popups do — scale up from
    # 94 % with a small overshoot (PanelPopup: Easing.OutBack, overshoot 1.1,
    # 380 ms) and fade in; close fast and plain (InCubic, 140 ms).
    bezier = popOut,        0.34, 1.32, 0.64, 1
    bezier = popIn,         0.32, 0,    0.67, 0
    bezier = easeOutCubic,  0.33, 1,    0.68, 1

    animation = global,        1, 8,  default
    animation = border,        1, 4,  easeOutQuint
    animation = windows,       1, 3.5, easeOutQuint
    animation = windowsIn,     1, 3.8, popOut,      popin 94%
    animation = windowsOut,    1, 1.4, popIn,       popin 94%
    animation = fadeIn,        1, 2.2, easeOutCubic
    animation = fadeOut,       1, 1.4, popIn
    animation = fade,          1, 3,  quick
    animation = layers,        1, 2.5, easeOutQuint
    animation = layersIn,      1, 2.5, easeOutQuint, fade
    animation = layersOut,     1, 1.5, linear,       fade
    animation = workspaces,    1, 1.8, almostLinear, fade
    animation = workspacesIn,  1, 1.3, almostLinear, fade
    animation = workspacesOut, 1, 1.3, almostLinear, fade
}

dwindle {
    pseudotile     = true
    preserve_split = true
    smart_split    = false
}

master {
    new_status = master
}

# Scroll binds (SUPER+Scroll workspaces, SUPER+SHIFT+Scroll opacity).
# scroll_event_delay defaults to 300 ms, and any wheel tick inside that window
# is NOT handled as a bind — Hyprland passes it straight to the app under the
# cursor (KeybindManager::onAxisEvent returns "pass" while the timer runs). So
# SUPER+SHIFT+Scroll over ghostty changed opacity once and scrolled the
# terminal with every other tick, and felt slow. 0 = every tick is a bind and
# none leak through.
binds {
    scroll_event_delay = 0
}

misc {
    # Hyprland's own text (group bars …) — set-font.py
    font_family = JetBrainsMono Nerd Font
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    disable_splash_rendering = true
    vfr = true          # variable refresh: big battery win when idle
    vrr = 0
    focus_on_activate = true
}

# ─── Input ─────────────────────────────────────────────────────────────────
input {
    kb_layout  = us
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll      = true
        tap-to-click        = true
        disable_while_typing = true
        scroll_factor       = 0.6
        clickfinger_behavior = true
    }
}

# 3-finger horizontal swipe to change workspace.
# NOTE: the old `gestures { workspace_swipe = true }` block was removed in
# Hyprland 0.49+; this one-line form is the current syntax.
gesture = 3, horizontal, workspace

cursor {
    inactive_timeout = 5
    hide_on_key_press = true
}

# ─── Keybinds ──────────────────────────────────────────────────────────────
bind = $mainMod,       Return, exec, $terminal
bind = $mainMod,       D,      exec, $menu
bind = $mainMod,       B,      exec, $browser
bind = $mainMod SHIFT, B,      exec, $browserAlt              # Firefox
# The Windows volume is BitLocker, so `gw` inside yazi has nowhere to go until
# something unlocks it. Start that in the background: Hyprland runs exec through
# `/bin/sh -c`, so `&` detaches it, and --ensure never prompts and never prints
# — opening the file manager is never delayed or blocked by the disk.
bind = $mainMod,       E,      exec, ~/.config/hypr/mount-windows.sh --ensure & $fileMgr
bind = $mainMod ALT,   E,      exec, nautilus --new-window   # Files (Nautilus); Alt+O in yazi opens it at the current folder
# SHIFT+C, not C: plain SUPER+C is hyprpicker.
bind = $mainMod SHIFT, C,      exec, $editor                          # VS Code
# Focus the window if it's already open, otherwise launch (focus-or-launch.sh).
bind = $mainMod SHIFT, M,      exec, ~/.config/hypr/focus-or-launch.sh spotify /usr/bin/spotify   # Spotify
bind = $mainMod SHIFT, D,      exec, ~/.config/hypr/focus-or-launch.sh vesktop /usr/bin/vesktop   # Discord (Vesktop)
bind = $mainMod,       O,      exec, ~/.config/hypr/focus-or-launch.sh obsproject /usr/bin/obs      # OBS Studio
bind = $mainMod SHIFT, O,      exec, ~/.config/hypr/focus-or-launch.sh kdenlive /usr/bin/kdenlive   # Kdenlive
bind = $mainMod,       M,      exec, ~/.local/bin/qs ipc call players toggle || ~/.config/hypr/media-menu.sh   # players deck (PlayersPopup: laptop | phone; GTK menu if the shell is down)
bind = $mainMod ALT,   D,      exec, ~/.local/bin/dl-popup status                                  # downloads (aria2 queue)
bind = $mainMod,       Q,      killactive,
bind = $mainMod SHIFT, E,      exit,
bind = $mainMod,       V,      togglefloating,
bind = $mainMod,       F,      fullscreen, 0
bind = $mainMod SHIFT, F,      fullscreen, 1
bind = $mainMod ALT,   P,      pseudo,        # was SUPER+P until the display switch
bind = $mainMod,       P,      exec, ~/.local/bin/qs ipc call display cycle  # duplicate <-> extend (like Win+P)
bind = $mainMod ALT,   T,      togglesplit,   # was SUPER+T until the workspace picker
# Desktop theme picker: Catppuccin Mocha, Tokyo Night, Gruvbox, Nord, Rosé Pine,
# Everforest, Dracula, Kanagawa — the whole desktop (set-theme.sh). `b` in the
# picker switches the bar style (classic / floating islands).
bind = $mainMod SHIFT, T,      exec, ~/.local/bin/qs ipc call themepicker toggle  # pick theme (was SUPER+T)
bind = $mainMod,       X,      exec, hyprlock
# The power panel under the top bar's ⏻ pill (PowerPopup.qml; toggles). nwg-bar
# only if the shell isn't running (self-toggling, Escape / Cancel closes it).
bind = $mainMod SHIFT, X,      exec, ~/.local/bin/qs ipc call power toggle || nwg-bar   # power menu
bind = $mainMod,       C,      exec, hyprpicker -a      # pick colour -> clipboard
# Theme accent for the whole environment. Previews live as you move the
# selection; Escape puts back what you started with. set-accent.sh holds the
# templates and the pristine backups — see its header.
bind = $mainMod ALT,   C,      exec, /usr/bin/python3 ~/.config/hypr/accent-picker.py  # pick accent colour
bind = $mainMod,       T,      exec, /usr/bin/python3 ~/.config/hypr/tasks.py toggle  # tasks panel (was SUPER+SHIFT+T)
# Workspace picker: the wallpaper picker's slanted-card carousel, one card per
# occupied workspace plus the next empty one, each a live-looking miniature
# (~/.config/quickshell/WorkspacePicker.qml). Enter goes there, m carries the
# focused window along. Pressing the key again closes it.
bind = $mainMod,       Tab,    exec, ~/.local/bin/qs ipc call wspicker toggle  # workspace picker
bind = $mainMod, N,            exec, ~/.local/bin/qs ipc call panels toggle notifications system   # notification centre (NotifPopup; GTK fallback: notif-center.py)
bind = $mainMod, period,       exec, ~/.local/bin/qs ipc call panels nav start   # keyboard: open the sound panel (again: close); Tab / arrows / Enter inside, Ctrl+arrows to the other panels
# Escape also dismisses task reminders (dismiss-reminders.sh). bindn = non-consuming:
# the key still goes to the focused window, so Escape works everywhere as before.
bindn = , Escape, exec, ~/.config/hypr/dismiss-reminders.sh
bind = $mainMod,       A,      exec, ~/.config/hypr/dock-toggle.sh   # show/hide dock
# Carousel of slanted cards with colour filters; picking one also sets the
# accent to its colour (toggle that with `c`). Part of the Quickshell shell
# since 2026-10-10 (~/.config/quickshell/WallpaperPicker.qml, list from
# wallpaper-index.py) — instant, where the GTK wallpaper-picker.py took a
# Python + GTK start-up per press; that one still works standalone.
# Pressing the key again closes the picker, the other mode's key swaps.
bind = $mainMod,       W,      exec, ~/.local/bin/qs ipc call wallpicker toggle desktop  # pick wallpaper
# lock screen wallpaper is deliberately separate from the desktop one. Same
# carousel; lock mode swaps the setter (set-lockscreen.sh), drops videos, adds
# the "Live screen" (`screenshot`) card and starts with accent-follows OFF.
bind = $mainMod SHIFT, W, exec, ~/.local/bin/qs ipc call wallpicker toggle lock  # pick lock screen image
# gnome-control-center exits unless XDG_CURRENT_DESKTOP names GNOME
bind = $mainMod,       I,      exec, ~/.local/bin/qs ipc call settings toggle ""   # settings (SettingsPanel; GNOME Settings = right-click the gear)
bind = $mainMod,       slash,  exec, ghostty -e batcat --style=plain --paging=always ~/.config/hypr/CHEATSHEET.md   # keybind cheatsheet

# clipboard history
# Clipboard history: the top bar's clipboard popup (ClipboardPopup.qml). The
# old picker was: cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, V, exec, ~/.local/bin/qs ipc call clipboard toggle

# focus — focus-dir.py is movefocus that also reaches the floating popups
# (screenshot-save, tasks, notif-center, ...); plain movefocus never crosses
# between tiled and floating windows. With no floats around it IS movefocus.
bind = $mainMod, left,  exec, ~/.config/hypr/focus-dir.py l
bind = $mainMod, right, exec, ~/.config/hypr/focus-dir.py r
bind = $mainMod, up,    exec, ~/.config/hypr/focus-dir.py u
bind = $mainMod, down,  exec, ~/.config/hypr/focus-dir.py d
bind = $mainMod, H,     exec, ~/.config/hypr/focus-dir.py l
bind = $mainMod, J,     exec, ~/.config/hypr/focus-dir.py d
bind = $mainMod, K,     exec, ~/.config/hypr/focus-dir.py u
bind = $mainMod, L,     exec, ~/.config/hypr/focus-dir.py r

# move windows
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# resize
binde = $mainMod CTRL, left,  resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive,  40 0
binde = $mainMod CTRL, up,    resizeactive,  0 -40
binde = $mainMod CTRL, down,  resizeactive,  0  40

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# scratchpad
bind = $mainMod,     S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspace, special:magic

# cycle workspaces with the scroll wheel: the occupied ones, then one empty
# workspace after the last, then back to 1 (workspace-scroll.sh).
# (mouse_down fires on wheel UP — see the opacity binds below.)
bind = $mainMod, mouse_down, exec, ~/.config/hypr/workspace-scroll.sh next
bind = $mainMod, mouse_up,   exec, ~/.config/hypr/workspace-scroll.sh prev
# Touchpad version: SUPER + 3-finger swipe up/down, one step per swipe
# (see the opacity gestures below for why it isn't two-finger scroll).
gesture = 3, up,   mod: $mainMod, dispatcher, exec, ~/.config/hypr/workspace-scroll.sh next
gesture = 3, down, mod: $mainMod, dispatcher, exec, ~/.config/hypr/workspace-scroll.sh prev

# Transparency of the window under the mouse (opacity.sh).
# Scroll up = more solid, down = more see-through, 4% a tick, floor 70%. Middle-click resets it.
# Hyprland's names are inverted vs. the wheel: "mouse_down" fires on wheel UP
# (KeybindManager::onAxisEvent maps delta < 0 to mouse_down).
bind = $mainMod SHIFT, mouse_down, exec, ~/.config/hypr/opacity.sh up
bind = $mainMod SHIFT, mouse_up,   exec, ~/.config/hypr/opacity.sh down
bind = $mainMod SHIFT, mouse:274,  exec, ~/.config/hypr/opacity.sh reset
# Touchpad version: SUPER+SHIFT + 3-finger swipe up/down, one step per swipe.
# Two-finger scroll can't do it — onAxisEvent only fires mouse_up/mouse_down
# for WHEEL-source events, and libinput only reports swipes for 3+ fingers.
# Reset = SUPER+SHIFT + 3-finger click (clickfinger_behavior makes it middle).
gesture = 3, up,   mod: $mainMod SHIFT, dispatcher, exec, ~/.config/hypr/opacity.sh up
gesture = 3, down, mod: $mainMod SHIFT, dispatcher, exec, ~/.config/hypr/opacity.sh down

# mouse drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# screenshots — all three save to ~/Pictures/Screenshots, copy to the clipboard
# and raise a notification. The previous binds were a bare `grim - | wl-copy`:
# it worked, but wrote no file and gave no feedback, so it read as a dead key.
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/screenshot.sh region
bind = ,        Print,     exec, ~/.config/hypr/screenshot.sh screen
bind = SHIFT,   Print,     exec, ~/.config/hypr/screenshot.sh window

# ─── Laptop hardware keys ──────────────────────────────────────────────────
bindel = ,XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = ,XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = ,XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp,   exec, ~/.config/hypr/brightness.sh up 5
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/brightness.sh down 5

bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause,exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

# lid close -> lock
bindl = ,switch:on:Lid Switch, exec, hyprlock

# ─── Window rules ──────────────────────────────────────────────────────────
# NOTE: Hyprland 0.53 uses BLOCK syntax for windowrule. The old one-line
# `windowrule = float, class:...` form and `windowrulev2` are both gone.

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-system-dialogs
    match:class = ^(pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator)$
    float = yes
}

windowrule {
    name = size-pavucontrol
    match:class = ^(pavucontrol)$
    size = 800 600
}
# The wallpaper grid is a NORMAL window, not a layer surface — deliberately, so
# it needs no namespace-keyed blur rule and cannot repeat landmines 13/16.
# Its app_id comes from GLib.set_prgname() in the script.
windowrule {
    name = float-wallpaper-grid
    match:class = ^([Ww]allpaper-grid(\.py)?)$
    float = yes
}
windowrule {
    name = center-wallpaper-grid
    match:class = ^([Ww]allpaper-grid(\.py)?)$
    center = yes
}

# Same deal for the accent picker: normal toplevel, app_id from set_prgname().
windowrule {
    name = float-accent-picker
    match:class = ^([Aa]ccent-picker(\.py)?)$
    float = yes
}
windowrule {
    name = center-accent-picker
    match:class = ^([Aa]ccent-picker(\.py)?)$
    center = yes
}

# File open/save dialogs are yazi in ghostty (xdg-desktop-portal-termfilechooser,
# ~/.config/xdg-desktop-portal-termfilechooser/yazi-picker.sh sets this class).
windowrule {
    name = float-file-picker
    match:class = ^(com\.samrudh\.filepicker)$
    float = yes
}
windowrule {
    name = size-file-picker
    match:class = ^(com\.samrudh\.filepicker)$
    size = 1200 720
}
windowrule {
    name = center-file-picker
    match:class = ^(com\.samrudh\.filepicker)$
    center = yes
}

# Same deal for the network panel: normal toplevel, app_id from set_prgname().
# A dropdown under the bar's Wi-Fi icon: it only opens from a click on that
# icon, so the cursor IS the icon — centre on it, just below the bar (48, like
# notif-center). The bell's panel and mako's popups share that top-right
# corner: the two panels close each other, and popups hide while it is open
# (mako mode netpanel-open).
windowrule {
    name = float-network-panel
    match:class = ^([Nn]etwork-panel(\.py)?)$
    float = yes
    size = 420 400
    move = (cursor_x-window_w*0.5) 48
}

# Tasks panel (tasks.py, the bottom bar's to-do icon): same deal, but it opens
# just above the bottom bar on the right, where its icon now sits (left of the
# keep-awake toggle), instead of centred.
windowrule {
    name = float-tasks-panel
    match:class = ^([Tt]asks-panel)$
    float = yes
    size = 440 620
    move = (monitor_w-window_w-8) (monitor_h-window_h-52)
}

# "Save screenshot?" popup after every capture (screenshot-save.py, run by
# screenshot.sh): floats centred like the other small panels.
windowrule {
    name = float-screenshot-save
    match:class = ^(screenshot-save)$
    float = yes
    center = yes
}

# Notification centre (notif-center.py — the bell in the top bar): drops down
# under the bell at the top right, like the tasks panel does from the bottom.
windowrule {
    name = float-notif-center
    match:class = ^(notif-center)$
    float = yes
    size = 440 620
    move = (monitor_w-window_w-8) 48
}

# Media dropdown (media-menu.py — SUPER+M, the bar's chevron): a popup
# just above the bottom bar at the left. Height comes from the window itself
# (one row per player), so no size here. x = 82, not fuzzel's 8: fuzzel was an
# OVERLAY layer surface, but this is a window, and the sidebar (nwg-dock, on
# the `top` layer, x 6–74) draws OVER windows — at 8 it covered the icons.
windowrule {
    name = float-media-menu
    match:class = ^(media-menu)$
    float = yes
    move = 82 (monitor_h-window_h-52)
}

# Kdenlive's welcome / quick-setup screen is a translucent QML window that
# would otherwise be TILED to half the screen, leaving a big see-through hole
# around a small card. It maps titled exactly "Kdenlive" — but so does the
# main window when opened from that screen, so this floats both and
# kdenlive-tile.sh tiles the main one back as soon as it renames itself.
# Floating here (rather than in the script) is what gives the card its own
# natural size. The main window's opacity is opacity-watch.sh's op100 tag.
windowrule {
    name = float-kdenlive-splash
    match:class = ^(org\.kde\.kdenlive)$
    match:title = ^(Kdenlive)$
    float = yes
    center = yes
}

# Ghostty's WINDOW starts at 100% rather than the global 92% — via the
# "op100" tag that opacity-watch.sh adds, NOT a
# windowrule: a class rule here fought the opNN tag rules and made Ghostty
# flicker on every title change. (Browsers used to be pinned opaque too; they
# follow the global default now — fullscreen too, via fullscreen_opacity.)

# layerrule moved to block syntax too, and `name` must be the first field.
layerrule {
    name = blur-dock
    # The sidebar registers as "nwg-dock", not "dock" — this rule matched
    # nothing, so the sidebar was never blurred either (landmine 16).
    match:namespace = ^(nwg-dock)$
    blur = true
    ignore_alpha = 0.3
    # xray: blur the WALLPAPER, not the windows under it. The bars always sit
    # over the wallpaper (their exclusive zone keeps windows out), so they read
    # as tinted frosted glass; the dock floats over windows, and without xray
    # it blurred a dark editor into a flat, near-opaque slab instead.
    xray = true
}

# The Quickshell dock (~/.config/quickshell/Dock.qml) — same glass as the
# nwg-dock rule above, for the same reasons.
layerrule {
    name = blur-qs-dock
    match:namespace = ^(qs-dock)$
    blur = true
    ignore_alpha = 0.3
    xray = true
}

# The two Quickshell pickers fade themselves in; Hyprland's layersIn fade on
# top of that (250 ms) only made them feel late.
layerrule {
    name = noanim-qs-pickers
    match:namespace = ^(qs-wallpaper-picker|qs-workspace-picker|qs-theme-picker)$
    no_anim = true
}

# The Quickshell bars (TopBar.qml / BottomBar.qml). waybar's rule below only
# ever matched the TOP bar (the bottom one was "bottombar"); both are glass now.
layerrule {
    name = blur-qs-bars
    match:namespace = ^(qs-bar|qs-bottombar)$
    blur = true
    ignore_alpha = 0.3
    # their popups too: the audio / network / notification / music panels go
    # translucent with Settings › Appearance › Transparency (Theme.panelOpacity)
    blur_popups = true
}

# Settings (SettingsPanel.qml): a full-screen layer — the dim around the card
# (alpha 0.38) stays under ignore_alpha, so only the card itself is frosted
# when its transparency is turned down.
layerrule {
    name = blur-qs-settings
    match:namespace = ^(qs-settings)$
    blur = true
    ignore_alpha = 0.45
}

layerrule {
    name = blur-waybar
    match:namespace = ^(waybar)$
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-launcher
    # fuzzel's layer-shell namespace is "launcher", NOT "fuzzel" — verified with
    # `hyprctl layers` while a picker was open. This rule matched ^(fuzzel)$ for
    # the life of the config and therefore never blurred anything.
    match:namespace = ^(launcher)$
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-app-grid
    match:namespace = ^(nwg-drawer)$
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-power-bar
    # nwg-bar 0.1.6 does NOT set a namespace, so it inherits gtk-layer-shell's
    # library default — verified with `hyprctl layers` while it was open, since
    # assuming the program name is what bit us with fuzzel (landmine 16).
    # This is a generic name: anything else using gtk-layer-shell without
    # setting its own namespace would match too. Nothing else here does
    # (nwg-dock/nwg-drawer/waybar/fuzzel/mako all set their own).
    match:namespace = ^(gtk-layer-shell)$
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-notifications
    match:namespace = ^(notifications)$
    blur = true
}

# Night light (night-light.sh — right-click the brightness pill): its screen
# shader, or nothing. Sourced so a reload / new login keeps it as it was.
source = ~/.config/hypr/night-light.conf

# Per-window opacity steps for SUPER+SHIFT+Scroll — must come after every other
# opacity rule (opacity.sh); only the video-fullscreen rule below beats it.
source = ~/.config/hypr/opacity-rules.conf

# A fullscreened VIDEO is fully opaque; plain fullscreen (F11, SUPER+F) keeps
# the window's transparency. video-fullscreen.py tags the window "vidfs" only
# while the player itself is fullscreen — Firefox/Brave via the "Video
# fullscreen" extension (~/.config/video-fullscreen), YouTube Music via its
# MPRIS Fullscreen — and drops the tag when it leaves. State 2 only. After the
# opNN tag rules so it wins; wallpaper-fullscreen.py then sees an opaque
# window and pauses.
windowrule {
    name = video-fullscreen-opaque
    match:tag = vidfs
    match:fullscreen_state_internal = 2
    opacity = 1.0 override 1.0 override 1.0 override
}

# Keybinds changed in Settings › Keybindings (the shell's settings panel,
# settings-keybinds.py): `unbind` + `bind` pairs, plus the empty `kbcapture`
# submap used while recording a combo. LAST, so its unbinds see every bind.
source = ~/.config/hypr/keybinds-user.conf
