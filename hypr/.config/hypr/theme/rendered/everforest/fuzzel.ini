# ─── fuzzel · Catppuccin Mocha ───
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
icon-theme=Papirus-Mocha
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty -e
layer=overlay
lines=10
width=42
horizontal-pad=22
vertical-pad=16
inner-pad=8

[colors]
background=2d353be6
text=d3c6aaff
match=e67e80ff
selection=343f44ff
selection-text=d3c6aaff
selection-match=e67e80ff
border=@@ACCENT@@ff
prompt=c8bea4ff
placeholder=9da9a0ff
input=d3c6aaff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g
execute=Return KP_Enter Control+y
cursor-left=Left Control+b
cursor-right=Right Control+f
prev=Up Control+p
next=Down Control+n
