# ─── tmux · Catppuccin Mocha ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
setw -g mode-keys vi

# prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# splits that keep the cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# vim-style pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Catppuccin Mocha colours ─────────────────────────────────────────────
thm_bg="#2d353b"
thm_fg="#d3c6aa"
thm_surface0="#343f44"
thm_surface1="#3d484d"
thm_overlay0="#7a8478"
thm_mauve="#@@ACCENT@@"
thm_peach="#e69875"
thm_blue="#82a9c9"
thm_crust="#1e2326"

set -g status-position top
set -g status-style "bg=$thm_bg,fg=$thm_fg"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[bg=$thm_mauve,fg=$thm_crust,bold]  #S #[bg=$thm_bg,fg=$thm_mauve]"
set -g status-right "#[fg=$thm_surface0]#[bg=$thm_surface0,fg=$thm_blue] 󰃰 %H:%M #[bg=$thm_surface0,fg=$thm_peach]#[bg=$thm_peach,fg=$thm_crust,bold] 󰒋 #h "

setw -g window-status-format "#[fg=$thm_overlay0] #I:#W "
setw -g window-status-current-format "#[bg=$thm_surface0,fg=$thm_peach]#[bg=$thm_surface0,fg=$thm_fg,bold] #I:#W #[bg=$thm_bg,fg=$thm_surface0]"
setw -g window-status-separator ""

set -g pane-border-style "fg=$thm_surface1"
set -g pane-active-border-style "fg=$thm_mauve"
set -g message-style "bg=$thm_surface0,fg=$thm_fg"
set -g mode-style "bg=$thm_surface1,fg=$thm_fg"
