# ─── fuzzel · Catppuccin Mocha ───
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
icon-theme=Papirus-Mocha
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty -e
layer=overlay
lines=10
width=42
horizontal-pad=22
vertical-pad=16
inner-pad=8

[colors]
background=282a36e6
text=f8f8f2ff
match=ff5555ff
selection=343746ff
selection-text=f8f8f2ff
selection-match=ff5555ff
border=@@ACCENT@@ff
prompt=dadbe6ff
placeholder=8790bfff
input=f8f8f2ff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g
execute=Return KP_Enter Control+y
cursor-left=Left Control+b
cursor-right=Right Control+f
prev=Up Control+p
next=Down Control+n
