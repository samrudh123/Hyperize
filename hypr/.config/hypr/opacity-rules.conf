# Generated for opacity.sh — one rule per step. SUPER+SHIFT+Scroll tags the
# window under the mouse "opNN" and the matching rule below sets its opacity.
# Tags, not `dispatch setprop`: setprop values are wiped whenever Hyprland
# re-evaluates window rules, which happens on every TITLE change (a browser
# switching tab, Spotify changing song, a terminal spinner) — the window
# snapped back to the default within half a second. Tags survive that.
# Sourced at the END of hyprland.conf so these win over the ghostty rule.
# Rules exist for every even value 70..100; opacity.sh steps by an even STEP.
# Values: active, inactive, fullscreen — the third makes a window keep its
# level when fullscreened/maximised (else decoration:fullscreen_opacity).

windowrule {
    name = opacity-70
    match:tag = op70
    opacity = 0.70 override 0.70 override 0.70 override
}
windowrule {
    name = opacity-72
    match:tag = op72
    opacity = 0.72 override 0.70 override 0.72 override
}
windowrule {
    name = opacity-74
    match:tag = op74
    opacity = 0.74 override 0.70 override 0.74 override
}
windowrule {
    name = opacity-76
    match:tag = op76
    opacity = 0.76 override 0.72 override 0.76 override
}
windowrule {
    name = opacity-78
    match:tag = op78
    opacity = 0.78 override 0.74 override 0.78 override
}
windowrule {
    name = opacity-80
    match:tag = op80
    opacity = 0.80 override 0.76 override 0.80 override
}
windowrule {
    name = opacity-82
    match:tag = op82
    opacity = 0.82 override 0.78 override 0.82 override
}
windowrule {
    name = opacity-84
    match:tag = op84
    opacity = 0.84 override 0.80 override 0.84 override
}
windowrule {
    name = opacity-86
    match:tag = op86
    opacity = 0.86 override 0.82 override 0.86 override
}
windowrule {
    name = opacity-88
    match:tag = op88
    opacity = 0.88 override 0.84 override 0.88 override
}
windowrule {
    name = opacity-90
    match:tag = op90
    opacity = 0.90 override 0.86 override 0.90 override
}
windowrule {
    name = opacity-92
    match:tag = op92
    opacity = 0.92 override 0.88 override 0.92 override
}
windowrule {
    name = opacity-94
    match:tag = op94
    opacity = 0.94 override 0.90 override 0.94 override
}
windowrule {
    name = opacity-96
    match:tag = op96
    opacity = 0.96 override 0.92 override 0.96 override
}
