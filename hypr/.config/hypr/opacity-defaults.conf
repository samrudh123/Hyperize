# Per-app default opacity, in percent (even numbers, 70–100).
#
#   <window class> = <percent>        class as `hyprctl clients` shows it
#
# Apps not listed get the global 92 % (hyprland.conf decoration block).
# opacity-watch.sh applies these to every new window of the app.
# The opacity OSD (SUPER+SHIFT+Scroll) has a "Make default" button that
# writes this file for you: opacity.sh set-default <class> <percent>.
firefox = 88
zen = 88
com.mitchellh.ghostty = 96
org.pwmt.zathura = 88
