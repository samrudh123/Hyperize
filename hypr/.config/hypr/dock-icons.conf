# Custom sidebar icons.   Apply with:  ~/.config/hypr/dock-icons.sh
#
#   <pinned entry> = <icon name or absolute path>
#
# The entry on the left is the line as it appears in ~/.cache/nwg-dock-pinned
# (a window class for apps, e.g. `brave`, `code`, `org.gnome.Terminal`).
# The value on the right is either a themed icon name — anything under
# /usr/share/icons, e.g. `utilities-terminal` — or an absolute path to a
# .png/.svg of your own, e.g. ~/Pictures/icons/term.png
#
# Find themed names with:   ls /usr/share/icons/Yaru/48x48/apps | sed 's/\..*//'
# Preview one with:         gio open /usr/share/icons/Yaru/48x48/apps/<name>.png
#
# Remove a line and re-run the script to put the original icon back.
#
# ── Reordering the sidebar ─────────────────────────────────────────────────
# Order is just the line order of ~/.cache/nwg-dock-pinned. Edit that file and
# the dock picks it up on its next refresh — no restart needed. Right-clicking
# an icon in nwg-drawer (SUPER+D) pins/unpins without editing anything by hand.

# Example — uncomment and adjust to taste:
# org.gnome.Terminal = utilities-terminal
