# ─── fuzzel · Catppuccin Mocha ───
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
icon-theme=Papirus-Mocha
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty -e
layer=overlay
lines=10
width=42
horizontal-pad=22
vertical-pad=16
inner-pad=8

[colors]
background=1a1b26e6
text=c0caf5ff
match=f7768eff
selection=24283bff
selection-text=c0caf5ff
selection-match=f7768eff
border=9ece6aff
prompt=a9b1d6ff
placeholder=737aa2ff
input=c0caf5ff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g
execute=Return KP_Enter Control+y
cursor-left=Left Control+b
cursor-right=Right Control+f
prev=Up Control+p
next=Down Control+n
