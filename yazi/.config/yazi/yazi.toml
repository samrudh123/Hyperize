[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_hidden    = true          # dotfiles visible by default; `.` still toggles
show_symlink   = true
scrolloff      = 5
# "touch" = horizontal wheel (touchpad sideways swipe, tilt wheel, and
# Shift+wheel via yazi-shiftwheel.py) — scrolls text previews sideways
# (plugins/hscroll.yazi). The preset leaves it out.
mouse_events   = [ "click", "scroll", "touch", "drag" ]

[preview]
max_width  = 1200
max_height = 1800

# Markdown opens rendered (glow, in yazi's terminal) instead of in $EDITOR.
# `block = true` hands glow the terminal; quit the pager with `q` to return.
# `O` on a .md file still offers the editor via the "edit" opener (nvim).
[opener]
# Text files open in Neovim (replaces the preset `${EDITOR:-vi}`, which was vim).
edit = [
  { run = "nvim %s", block = true, desc = "nvim", for = "unix" },
]
markdown = [
  { run = "glow -p %s1", block = true, desc = "Preview (glow)", for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.{md,markdown,mdx}", use = [ "markdown", "edit", "reveal" ] },
]

# Preview pane renders markdown through glow (plugins/md.yazi), PDFs the
# way zathura shows them — theme colours + statusbar (plugins/zathura-pdf.yazi),
# and text with sideways scrolling (plugins/hscroll.yazi).
[plugin]
prepend_previewers = [
  { url = "*.{md,markdown,mdx}", run = "md" },
  { mime = "application/pdf", run = "zathura-pdf" },
  # same files the preset's `code` previewer takes; hscroll IS `code` until
  # you scroll sideways (Shift+Left/Right, Shift+wheel)
  { mime = "text/*", run = "hscroll" },
  { mime = "application/{mbox,javascript,wine-extension-ini}", run = "hscroll" },
]
prepend_preloaders = [
  { mime = "application/pdf", run = "zathura-pdf" },
]
