[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_hidden    = true          # dotfiles visible by default; `.` still toggles
show_symlink   = true
scrolloff      = 5

[preview]
max_width  = 1200
max_height = 1800

# Markdown opens rendered (glow, in yazi's terminal) instead of in $EDITOR.
# `block = true` hands glow the terminal; quit the pager with `q` to return.
# `O` on a .md file still offers the editor via the preset "edit" opener.
[opener]
markdown = [
  { run = "glow -p %s1", block = true, desc = "Preview (glow)", for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.{md,markdown,mdx}", use = [ "markdown", "edit", "reveal" ] },
]

# Preview pane renders markdown through glow (plugins/md.yazi), and PDFs the
# way zathura shows them — theme colours + statusbar (plugins/zathura-pdf.yazi).
[plugin]
prepend_previewers = [
  { url = "*.{md,markdown,mdx}", run = "md" },
  { mime = "application/pdf", run = "zathura-pdf" },
]
prepend_preloaders = [
  { mime = "application/pdf", run = "zathura-pdf" },
]
